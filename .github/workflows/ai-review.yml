# The job runs only for pull requests opened from a branch of this repository by an owner,
# member or collaborator, and only for slash commands written by an owner, member or
# collaborator. Fork pull requests and comments from anyone else never start a review.
#
# The review model is resolved at run time, in order of precedence:
#   1. `--config.model=<model>` in a `/review` comment (the job condition restricts who may comment);
#   2. the repository variables AI_REVIEW_MODEL, AI_REVIEW_FALLBACK_MODELS, AI_REVIEW_MAX_TOKENS;
#   3. the defaults in the "Resolve review model" step.
name: PR-Agent Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

concurrency:
  group: agent-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event.comment.id || 'push' }}
  cancel-in-progress: true

jobs:
  pull-request-context:
    if: github.event_name == 'pull_request' || github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      same_repository: ${{ steps.context.outputs.same_repository }}
    steps:
      - name: Resolve pull request source
        id: context
        uses: actions/github-script@v7
        with:
          script: |
            const pullNumber = context.eventName === "pull_request"
              ? context.payload.pull_request.number
              : context.payload.issue.number;
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });
            core.setOutput(
              "same_repository",
              String(pull.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`),
            );

  review:
    needs: pull-request-context
    if: |
      github.event.sender.type != 'Bot' &&
      needs.pull-request-context.outputs.same_repository == 'true' &&
      ((github.event_name == 'pull_request' &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                 github.event.pull_request.author_association)) ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        startsWith(github.event.comment.body, '/') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                 github.event.comment.author_association)))

    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      issues: write
      contents: read

    steps:
      - name: Check for API key
        id: guard
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [[ -z "${OPENROUTER_API_KEY:-}" ]]; then
            echo "enabled=false" >>"$GITHUB_OUTPUT"
            echo "::warning::OPENROUTER_API_KEY is not set; skipping the review (no-op pass)."
          else
            echo "enabled=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Resolve review model
        id: model
        if: steps.guard.outputs.enabled == 'true'
        shell: bash
        env:
          DEFAULT_MODEL: openrouter/openai/gpt-5.6-luna
          DEFAULT_FALLBACK_MODELS: '["openrouter/anthropic/claude-sonnet-5"]'
          DEFAULT_MAX_TOKENS: "128000"
          VAR_MODEL: ${{ vars.AI_REVIEW_MODEL }}
          VAR_FALLBACK_MODELS: ${{ vars.AI_REVIEW_FALLBACK_MODELS }}
          VAR_MAX_TOKENS: ${{ vars.AI_REVIEW_MAX_TOKENS }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail

          model="${VAR_MODEL:-$DEFAULT_MODEL}"
          fallback_models="${VAR_FALLBACK_MODELS:-$DEFAULT_FALLBACK_MODELS}"
          max_tokens="${VAR_MAX_TOKENS:-$DEFAULT_MAX_TOKENS}"

          requested="$(printf '%s' "$COMMENT_BODY" \
            | grep -oE -- '--config\.model=[^[:space:]"]+' \
            | head -n 1 \
            | cut -d= -f2- || true)"

          if [[ -n "$requested" ]]; then
            if [[ "$requested" =~ ^[A-Za-z0-9._/:-]+$ ]]; then
              model="$requested"
              fallback_models="[]"
              echo "::notice::Review model overridden from the comment: $model"
            else
              echo "::warning::Ignoring malformed --config.model value; using $model."
            fi
          fi

          echo "model=$model" >>"$GITHUB_OUTPUT"
          echo "fallback_models=$fallback_models" >>"$GITHUB_OUTPUT"
          echo "max_tokens=$max_tokens" >>"$GITHUB_OUTPUT"
          echo "Review model: $model (fallbacks: $fallback_models)"

      - name: Run review
        if: steps.guard.outputs.enabled == 'true'
        uses: docker://pragent/pr-agent:0.41.0-github_action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          openrouter__key: ${{ secrets.OPENROUTER_API_KEY }}
          config.model: ${{ steps.model.outputs.model }}
          config.fallback_models: ${{ steps.model.outputs.fallback_models }}
          config.custom_model_max_tokens: ${{ steps.model.outputs.max_tokens }}
          config.publish_output_progress: "false"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
          pr_reviewer.extra_instructions: |
            Проект — плагин Obsidian на TypeScript со строгой слоистой архитектурой.
            Полный свод правил приведён в best_practices.md в корне репозитория.
            Приоритет при ревью:
            1. Направление зависимостей apps -> adapters -> application -> core.
            2. Отсутствие Node, DOM и Obsidian API в src/core/ и в портах application.
            3. Обращение к внешним сервисам только через порт из src/application/ports/
               или контракт из src/application/contracts/; use case не импортирует адаптер.
            4. Импорты между модулями только через алиасы @core/*, @application/*,
               @adapters/*, @apps/*, @shared/* и публичный index.ts, без глубоких путей.
            5. Обработка недоверенных внешних данных, отмена асинхронных операций,
               таймауты, освобождение подписок, слушателей и таймеров.
            6. Наличие тестов на каждое изменённое поведение и регрессионного теста
               на каждое исправление бага.
            Не предлагай комментарии в коде, кроме краткого JSDoc перед функцией
            или классом. Не предлагай новые зависимости без обоснования.
