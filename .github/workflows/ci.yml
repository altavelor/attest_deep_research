name: CI

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run type checking
        run: npm run typecheck

      - name: Verify core stays platform-neutral
        run: npm run typecheck:core

      - name: Verify architecture invariants
        run: npm run depcruise

      - name: Verify formatting
        run: npm run format

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error
          retention-days: 14

      - name: Build coverage report
        if: always()
        shell: bash
        run: |
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            git cat-file -e "$base^{commit}" 2>/dev/null || base=""
          fi
          if [ -n "$base" ]; then
            node scripts/coverage-report.mjs --base "$base" --out "$GITHUB_STEP_SUMMARY" > "$RUNNER_TEMP/coverage-report.md"
          else
            node scripts/coverage-report.mjs --out "$GITHUB_STEP_SUMMARY" > "$RUNNER_TEMP/coverage-report.md"
          fi

      - name: Upload coverage report comment body
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report-comment
          path: ${{ runner.temp }}/coverage-report.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Build plugin
        run: npm run build

      - name: Verify build output
        shell: bash
        run: |
          test -f dist/main.js
          test -f dist/manifest.json
          test -f dist/styles.css

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: obsidian-plugin-build
          path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
          if-no-files-found: error
          retention-days: 14

  coverage-comment:
    name: Publish coverage comment
    needs: build
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download coverage report comment body
        id: download
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-report-comment
          path: report

      - name: Publish coverage report comment
        if: steps.download.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- attest-coverage-report -->";
            const path = "report/coverage-report.md";
            if (!fs.existsSync(path)) {
              core.warning("Coverage report artifact is missing; nothing to publish.");
              return;
            }
            const body = fs.readFileSync(path, "utf8");
            if (!body.startsWith(marker) || body.length > 65536) {
              core.warning("Coverage report artifact is not a coverage report; nothing to publish.");
              return;
            }
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                per_page: 100,
              });
              const existing = comments.find(
                (comment) => comment.user?.type === "Bot" && comment.body?.includes(marker),
              );
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  body,
                });
              }
            } catch (error) {
              core.warning(`Coverage comment not published: ${error.message}`);
            }
