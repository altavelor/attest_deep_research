name: OpenRouter AI Code Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

concurrency:
  group: agent-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      github.event_name == 'pull_request' || 
      (github.event.issue.pull_request != null && contains(github.event.comment.body, '@ai-review'))

    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read
      issues: write

    steps:
      - name: Check for API key
        id: guard
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [[ -z "${OPENROUTER_API_KEY:-}" ]]; then
            echo "enabled=false" >>"$GITHUB_OUTPUT"
            echo "::warning::OPENROUTER_API_KEY is not set; skipping the review gate (no-op pass)."
          else
            echo "enabled=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Checkout pull request merge commit
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.pull_request.number || github.event.issue.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: React to comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });

      - name: Run review
        if: steps.guard.outputs.enabled == 'true'
        uses: keithah/multi-provider-code-review@main
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          PROMT_FILE: .github/agent/review.md
          OUTPUT_FILE: agent-review.md
          REVIEW_PROVIDERS: "openai/gpt-5.6-luna-pro"
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Display review
        if: always() && steps.guard.outputs.enabled == 'true' && hashFiles('agent-review.md') != ''
        shell: bash
        run: cat agent-review.md

      - name: Read verdict
        id: verdict
        if: steps.guard.outputs.enabled == 'true' && hashFiles('agent-review.md') != ''
        shell: bash
        run: |
          verdict="$(grep -E '^VERDICT: (PASS|FAIL)$' agent-review.md | tail -n 1 || true)"
          echo "value=${verdict}" >>"$GITHUB_OUTPUT"
          if [[ "$verdict" == "VERDICT: PASS" ]]; then
            echo "pass=true" >>"$GITHUB_OUTPUT"
          else
            echo "pass=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Upload review artifact
        if: always() && steps.guard.outputs.enabled == 'true' && hashFiles('agent-review.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: agent-review-${{ github.event.pull_request.number || github.event.issue.number }}
          path: agent-review.md

      - name: Enforce verdict
        if: steps.guard.outputs.enabled == 'true' && steps.verdict.outputs.pass != ''
        shell: bash
        run: |
          if [[ "${{ steps.verdict.outputs.pass }}" != "true" ]]; then
            echo "::error::Agent review did not pass (${{ steps.verdict.outputs.value }})"
            exit 1
          fi
