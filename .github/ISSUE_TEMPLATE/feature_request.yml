name: Feature request
description: Suggest a capability or an improvement
title: "[Feature]: "
labels:
  - enhancement
  - type:feature

body:
  - type: markdown
    attributes:
      value: |
        Open-ended ideas and questions fit better in
        [Discussions](../../discussions). Use this form when you can describe a concrete change.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you unable to do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should Attest behave instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, and why they are not enough.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Chat and answers
        - Citations and verification
        - Vault indexing and search
        - Web search and sources
        - Model providers and settings
        - Diagnostics
        - Other
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and discussions and this is not a duplicate.
          required: true
